spring.application.name=demo

# DB_PASSWORD must be set in the process environment. .env is for Docker Compose only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/easyton?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:easyton}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Do not include exception messages, stack traces or rejected credentials in error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# 온통청년 청년정책 Open API 인증키. 프로세스 환경변수 YOUTH_API_KEY로 전달한다(.env는 Docker Compose 전용).
# 비어 있으면 추천할 지원사업이 없다(가상 사업은 만들지 않는다).
youth.api.key=${YOUTH_API_KEY:}

# 계약서 사진·텍스트 분석: Gemini API를 사용한다. 내용이 Google의 외부 AI로 전송된다.
# 키는 프로세스 환경변수 GEMINI_API_KEY로 전달한다. 모델은 GEMINI_MODEL로 바꿀 수 있다. CONTRACT_IMAGE_ENABLED=false로 끌 수 있다.
contract.image.gemini-api-key=${GEMINI_API_KEY:}
contract.image.gemini-model=${GEMINI_MODEL:gemini-3.5-flash}
contract.image.enabled=${CONTRACT_IMAGE_ENABLED:true}
contract.image.timeout-seconds=90
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
