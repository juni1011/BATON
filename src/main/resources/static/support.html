<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>지원사업 추천 | 알바 첫걸음</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/support.css">
    <link rel="stylesheet" href="/css/support-map.css">
    <link rel="icon" href="/images/logo-b2-mark.svg" type="image/svg+xml">
    <meta name="theme-color" content="#9B3F3F">
    <script src="/js/common.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/support-ai.js" defer></script>
    <script src="/js/support.js" defer></script>
</head>
<body class="support-page">
    <header class="site-header">
        <div class="site-account">
            <nav class="account-nav" aria-label="계정 메뉴">
                <a href="/signin.html">로그인</a>
                <a href="/signup.html">회원가입</a>
            </nav>
        </div>
        <nav class="primary-nav" aria-label="공통 메뉴">
            <a class="site-name" href="/index.html" aria-label="알바 첫걸음 홈"><img class="site-logo" src="/images/logo-b2.svg" alt="알바 첫걸음" width="220" height="48"></a>
            <a href="/upload.html">계약서 점검</a>
            <a href="/support.html">지원사업 추천</a>
            <a href="/calendar.html">캘린더</a>
        </nav>
    </header>
    <main id="support-root">
        <p role="status">추천 화면을 준비하고 있어요…</p>
        <noscript><p class="notice warn">지원사업 추천을 이용하려면 자바스크립트를 켜 주세요.</p></noscript>
    </main>
    <section id="support-ai-panel" class="card stack" style="max-width: 960px; margin: 1rem auto; padding: 1.5rem" aria-labelledby="ai-title">
        <h2 id="ai-title">AI 추천 지원사업</h2>
        <p id="ai-recommendation" role="status" style="white-space: pre-line">카테고리나 지역을 선택하면 추천을 확인할 수 있어요.</p>
        <button id="ai-retry" type="button" class="btn small" hidden>추천 다시 받기</button>
    </section>
    <section class="card stack" style="max-width: 960px; margin: 1rem auto; padding: 1.5rem" aria-labelledby="resume-title">
        <h2 id="resume-title">이력서 AI 분석</h2>
        <form id="resume-form" class="stack">
            <label for="resume-file">이력서 파일 (PDF 또는 UTF-8 TXT, 최대 5MB)</label>
            <input id="resume-file" type="file" accept=".pdf,.txt" required>
            <p>분석을 누르면 파일이 Google Gemini로 전송됩니다.</p>
            <button class="btn primary" type="submit">이력서 분석하기</button>
        </form>
        <p id="resume-feedback" role="status" style="white-space: pre-line"></p>
    </section>
    <footer>
        <p class="support-map-credit">지도 데이터: <a href="https://sgis.kostat.go.kr" target="_blank" rel="noopener noreferrer">SGIS</a> ·
            <a href="https://github.com/vuski/admdongkor" target="_blank" rel="noopener noreferrer">admdongkor</a> · 2026.04 ·
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> (경계 단순화·지도 변환)</p>
        <p class="support-copyright">Made by RE: 지원 Corporation</p>
    </footer>
</body>
</html>
