<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 청년 지원사업 도우미</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/ui.js" defer></script>
    <style>
        .signup-panel { max-width: 440px; margin: 32px auto; }
        .signup-intro { text-align: center; }
        .signup-intro .lead { margin: 8px 0 24px; }
        .signup-service { margin: 0 0 8px; color: var(--primary); font-size: 14px; font-weight: 600; }
        .signup-form { padding: 28px; }
        .signup-form > * + * { margin-top: 20px; }
        .password-field { position: relative; }
        .password-field input { padding-right: 76px; }
        .password-toggle { position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
            border-color: transparent; color: var(--primary); }
        .signup-submit { width: 100%; }
        .signup-signin { margin: 0; text-align: center; }
        .signup-signin a { display: inline-block; padding: 8px; }
        @media (max-width: 640px) {
            .signup-panel { margin: 16px auto; }
            .signup-form { padding: 20px; }
        }
    </style>
</head>
<body>
    <header><nav aria-label="공통 메뉴">
        <a href="/index.html">홈</a>
        <a href="/support.html">지원사업 추천</a>
        <a href="/calendar.html">캘린더</a>
        <a href="/signin.html">로그인</a>
    </nav></header>
    <main>
        <section class="signup-panel" aria-labelledby="signup-title">
            <div class="signup-intro">
                <p class="signup-service">청년 지원사업 도우미</p>
                <h1 id="signup-title">회원가입</h1>
                <p class="lead">나에게 맞는 지원사업을 찾는 첫걸음을 시작해 보세요.</p>
            </div>
            <form id="signup-form" class="card stack signup-form" method="post" aria-labelledby="signup-title">
                <div>
                    <label for="name">이름</label>
                    <input id="name" name="name" type="text" placeholder="이름을 입력해 주세요"
                        autocomplete="name" maxlength="40" required>
                </div>
                <div>
                    <label for="email">이메일</label>
                    <input id="email" name="email" type="email" placeholder="beomjjang@dankook.ac.kr"
                        autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
                </div>
                <div>
                    <label for="password">비밀번호</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" placeholder="8자 이상 입력해 주세요"
                            autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="password-hint" required>
                        <button type="button" class="btn small password-toggle" data-password-toggle
                            aria-controls="password" aria-label="비밀번호 표시" aria-pressed="false" hidden>보기</button>
                    </div>
                    <p id="password-hint" class="hint">비밀번호는 8자 이상 입력해 주세요.</p>
                </div>
                <div>
                    <label for="password-confirm">비밀번호 확인</label>
                    <div class="password-field">
                        <input id="password-confirm" name="passwordConfirm" type="password" placeholder="비밀번호를 한 번 더 입력해 주세요"
                            autocomplete="new-password" maxlength="128" required>
                        <button type="button" class="btn small password-toggle" data-password-toggle
                            aria-controls="password-confirm" aria-label="비밀번호 확인 표시" aria-pressed="false" hidden>보기</button>
                    </div>
                </div>
                <div id="message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
                <button type="submit" class="btn primary signup-submit" id="signup-submit" disabled>회원가입</button>
                <noscript><p class="notice warn">회원가입 화면을 이용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
            </form>
            <p class="signup-signin small">이미 계정이 있으신가요? <a href="/signin.html">로그인</a></p>
        </section>
    </main>
    <footer>Made by RE: 지원 Corporation</footer>
    <script>
        "use strict";

        (() => {
            const form = document.getElementById("signup-form");
            const name = document.getElementById("name");
            const password = document.getElementById("password");
            const confirmation = document.getElementById("password-confirm");
            const message = document.getElementById("message");

            function validateFields() {
                name.setCustomValidity(name.value && !name.value.trim() ? "이름을 입력해 주세요." : "");
                const mismatch = confirmation.value && confirmation.value !== password.value;
                confirmation.setCustomValidity(mismatch ? "비밀번호가 일치하지 않습니다." : "");
            }

            for (const toggle of document.querySelectorAll("[data-password-toggle]")) {
                const input = document.getElementById(toggle.getAttribute("aria-controls"));
                const label = input === password ? "비밀번호" : "비밀번호 확인";
                toggle.addEventListener("click", () => {
                    const visible = input.type === "password";
                    input.type = visible ? "text" : "password";
                    toggle.textContent = visible ? "숨기기" : "보기";
                    toggle.setAttribute("aria-pressed", String(visible));
                    toggle.setAttribute("aria-label", `${label} ${visible ? "숨기기" : "표시"}`);
                });
                toggle.hidden = false;
            }

            form.addEventListener("input", () => {
                validateFields();
                message.hidden = true;
                message.textContent = "";
            });

            // 계정 API가 추가되면 이 제출 처리에 연결합니다. 입력값은 전송하거나 저장하지 않습니다.
            form.addEventListener("submit", event => {
                event.preventDefault();
                validateFields();
                if (!form.reportValidity()) return;
                message.textContent = "회원가입 기능을 준비 중입니다. 잠시 후 다시 이용해 주세요.";
                message.hidden = false;
            });

            document.getElementById("signup-submit").disabled = false;
        })();
    </script>
</body>
</html>
