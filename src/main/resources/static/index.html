<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>홈 | 청년 지원사업 도우미</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/index.js" defer></script>
</head>
<body>
    <header><nav aria-label="공통 메뉴">
        <a href="/index.html">홈</a>
        <a href="/support.html">지원사업 추천</a>
        <a href="/calendar.html">캘린더</a>
    </nav></header>
    <main>
        <section class="hero">
            <h1>청년 지원사업 도우미</h1>
            <p>내 정보를 입력하면 조건에 맞는 지원사업을 찾아 주고, 신청 마감일과 내 일정을 캘린더로 정리해 드립니다.</p>
            <div class="row">
                <a class="btn" href="/support.html">지원사업 추천 받기</a>
                <a class="btn ghost" href="/calendar.html">캘린더 보기</a>
            </div>
        </section>
        <h2>진행 순서</h2>
        <ol class="steps" id="steps"></ol>
        <div class="grid">
            <section class="card" aria-labelledby="summary-title">
                <h2 id="summary-title">추천 결과</h2>
                <div id="summary"></div>
            </section>
            <section class="card" aria-labelledby="upcoming-title">
                <h2 id="upcoming-title">다가오는 일정</h2>
                <div id="upcoming"></div>
            </section>
        </div>
        <div class="row between">
            <p class="muted small">입력한 내용은 이 브라우저에만 저장됩니다.</p>
            <button type="button" class="btn danger small" id="reset">저장된 내 정보 모두 지우기</button>
        </div>
    </main>
    <footer>본 서비스는 정보 제공용이며 지원사업 목록은 가상 예시입니다</footer>
</body>
</html>
