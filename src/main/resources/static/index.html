<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>홈 | 알바 계약 도우미</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/index.js" defer></script>
</head>
<body>
    <header><nav aria-label="공통 메뉴">
        <a href="/index.html">홈</a>
        <a href="/upload.html">계약서 업로드</a>
        <a href="/confirm.html">추출 값 확인</a>
        <a href="/report.html">점검 리포트</a>
        <a href="/support.html">지원사업 추천</a>
        <a href="/calendar.html">캘린더</a>
    </nav></header>
    <main>
        <section class="hero">
            <h1>알바 계약 도우미</h1>
            <p>근로계약서 내용을 올리면 꼭 확인해야 할 조항을 짚어 주고, 사장님께 물어볼 질문과 근무·급여 일정을 정리해 드립니다.</p>
            <div class="row">
                <a class="btn" href="/upload.html">계약서 점검 시작하기</a>
                <a class="btn ghost" id="continue" href="/report.html" hidden>내 리포트 이어서 보기</a>
            </div>
        </section>
        <h2>진행 순서</h2>
        <ol class="steps" id="steps"></ol>
        <div class="grid">
            <section class="card" aria-labelledby="summary-title">
                <h2 id="summary-title">내 계약 요약</h2>
                <div id="summary" class="stack"></div>
            </section>
            <section class="card" aria-labelledby="upcoming-title">
                <h2 id="upcoming-title">다가오는 일정</h2>
                <div id="upcoming"></div>
            </section>
        </div>
        <div class="row between">
            <p class="muted small">입력한 내용은 이 브라우저에만 저장됩니다.</p>
            <button type="button" class="btn danger small" id="reset">저장된 내 정보 모두 지우기</button>
        </div>
    </main>
    <footer>본 서비스는 정보 제공용이며 법률 자문이 아닙니다</footer>
</body>
</html>
