<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>캘린더 | 첫걸음</title>
    <link rel="stylesheet" href="/css/common.css?v=schedule-rows">
    <link rel="icon" href="/images/logo-b2-mark.svg" type="image/svg+xml">
    <meta name="theme-color" content="#9B3F3F">
    <script src="/js/common.js" defer></script>
    <script src="/js/ui.js?v=first-step-nav" defer></script>
    <script src="/js/calendar.js" defer></script>
</head>
<body class="portal calendar-page">
    <header class="site-header">
        <div class="site-account">
            <nav class="account-nav" aria-label="계정 메뉴">
                <a href="/signin.html">로그인</a>
                <a href="/signup.html">회원가입</a>
            </nav>
        </div>
        <nav class="primary-nav" aria-label="공통 메뉴">
            <a class="site-name" href="/index.html" aria-label="첫걸음 홈"><img class="site-mark" src="/images/logo-b2-mark.svg" alt="" width="56" height="56"><span class="site-wordmark">첫걸음</span></a>
            <a href="/upload.html?v=first-step-nav">계약서 점검</a>
            <a href="/support.html?v=first-step-nav">지원사업 추천</a>
            <a href="/calendar.html?v=first-step-nav">캘린더</a>
        </nav>
    </header>
    <main>
        <section class="calendar-intro">
            <div>
                <h1>캘린더</h1>
                <p class="lead">근무일, 급여일, 지원사업 마감일과 내 일정을 확인하세요.</p>
            </div>
            <a class="btn primary" id="new-event" href="#add-form">일정 추가</a>
        </section>
        <div class="calendar-layout">
            <section class="card calendar-month" aria-label="월간 캘린더">
                <div class="row between">
                    <div class="row">
                        <button type="button" class="btn small" id="prev" aria-label="이전 달">‹</button>
                        <h2 id="month-title" aria-live="polite"></h2>
                        <button type="button" class="btn small" id="next" aria-label="다음 달">›</button>
                        <button type="button" class="btn small" id="today">오늘</button>
                    </div>
                    <div class="checks" id="filters" role="group" aria-label="표시할 일정 종류"></div>
                </div>
                <div class="cal-head" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
                <div class="cal-grid" id="grid"></div>
            </section>
            <div class="calendar-sidebar">
                <section class="card" aria-labelledby="day-title">
                    <h2 id="day-title"></h2>
                    <div id="day-events"></div>
                </section>
                <section class="card" aria-labelledby="add-title">
                    <h2 id="add-title">개인 일정 추가</h2>
                    <form id="add-form" class="stack">
                        <div><label for="title">제목</label><input id="title" type="text" required maxlength="60"></div>
                        <div><label for="date">날짜</label><input id="date" type="date" required></div>
                        <div class="schedule-times" role="group" aria-labelledby="schedule-time-label">
                            <span class="label" id="schedule-time-label">시간</span>
                            <div class="schedule-clock">
                                <span>시작</span>
                                <select id="startHour" aria-label="시작 시"><option value="">시</option></select>
                                <select id="startMinute" aria-label="시작 분"></select>
                            </div>
                            <div class="schedule-clock">
                                <span>종료</span>
                                <select id="endHour" aria-label="종료 시"><option value="">시</option></select>
                                <select id="endMinute" aria-label="종료 분"></select>
                            </div>
                        </div>
                        <p class="hint">시작과 종료 시간을 비워 두면 종일 일정으로 저장돼요.</p>
                        <div><label for="description">메모 (선택)</label><input id="description" type="text" maxlength="200"></div>
                        <div id="message" class="notice" role="status" hidden></div>
                        <div class="row end"><button type="submit" class="btn primary">일정 저장</button></div>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <footer>Made by RE: 지원 Corporation</footer>
</body>
</html>
