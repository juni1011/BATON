<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 알바 첫걸음</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/ui.js" defer></script>
    <style>
        .signin-panel { max-width: 440px; margin: 32px auto; }
        .signin-intro { text-align: center; }
        .signin-intro .lead { margin: 8px 0 24px; }
        .signin-service { margin: 0 0 8px; color: var(--primary); font-size: 14px; font-weight: 600; }
        .signin-form { padding: 28px; }
        .signin-form > * + * { margin-top: 20px; }
        .password-field { position: relative; }
        .password-field input { padding-right: 76px; }
        .password-toggle { position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
            border-color: transparent; color: var(--primary); }
        .signin-submit { width: 100%; }
        .signin-guest { margin: 0; text-align: center; }
        .signin-guest a { display: inline-block; padding: 8px; }
        @media (max-width: 640px) {
            .signin-panel { margin: 16px auto; }
            .signin-form { padding: 20px; }
        }
    </style>
</head>
<body>
    <header class="site-header"><nav aria-label="공통 메뉴">
        <a class="site-name" href="/index.html">알바 첫걸음</a>
        <a href="/upload.html">계약서 점검</a>
        <a href="/support.html">지원사업 추천</a>
        <a href="/calendar.html">캘린더</a>
        <a href="/signin.html" aria-current="page">로그인</a>
    </nav></header>
    <main>
        <section class="signin-panel" aria-labelledby="signin-title">
            <div class="signin-intro">
                <p class="signin-service">알바 첫걸음</p>
                <h1 id="signin-title">로그인</h1>
                <p class="lead">나에게 맞는 지원사업과 일정을 확인해 보세요.</p>
            </div>
            <form id="signin-form" class="card stack signin-form" method="post" aria-labelledby="signin-title">
                <div>
                    <label for="email">이메일</label>
                    <input id="email" name="email" type="email" placeholder="beomjjang@dankook.ac.kr"
                        autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
                </div>
                <div>
                    <label for="password">비밀번호</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요"
                            autocomplete="current-password" required>
                        <button type="button" class="btn small password-toggle" id="toggle-password"
                            aria-controls="password" aria-label="비밀번호 표시" aria-pressed="false" hidden>보기</button>
                    </div>
                </div>
                <div id="message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
                <button type="submit" class="btn primary signin-submit" id="signin-submit" disabled>로그인</button>
                <noscript><p class="notice warn">로그인 화면을 이용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
            </form>
            <p class="signin-guest small">계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
            <p class="signin-guest small"><a href="/index.html">로그인 없이 둘러보기</a></p>
        </section>
    </main>
    <footer>Made by RE: 지원 Corporation</footer>
    <script>
        "use strict";

        (() => {
            const form = document.getElementById("signin-form");
            const password = document.getElementById("password");
            const toggle = document.getElementById("toggle-password");
            const message = document.getElementById("message");

            toggle.addEventListener("click", () => {
                const visible = password.type === "password";
                password.type = visible ? "text" : "password";
                toggle.textContent = visible ? "숨기기" : "보기";
                toggle.setAttribute("aria-pressed", String(visible));
                toggle.setAttribute("aria-label", visible ? "비밀번호 숨기기" : "비밀번호 표시");
            });

            // 로그인 API가 추가되면 이 제출 처리에 연결합니다. 입력값은 전송하거나 저장하지 않습니다.
            form.addEventListener("submit", event => {
                event.preventDefault();
                message.textContent = "로그인 기능을 준비 중입니다. 지금은 로그인 없이 서비스를 이용해 주세요.";
                message.hidden = false;
            });

            form.addEventListener("input", () => {
                message.hidden = true;
                message.textContent = "";
            });

            toggle.hidden = false;
            document.getElementById("signin-submit").disabled = false;
        })();
    </script>
</body>
</html>
