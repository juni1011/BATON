<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 알바 첫걸음</title>
    <link rel="stylesheet" href="/css/common.css?v=first-step-wordmark">
    <link rel="icon" href="/images/logo-b2-mark.svg" type="image/svg+xml">
    <meta name="theme-color" content="#9B3F3F">
    <script src="/js/ui.js?v=first-step-nav" defer></script>
    <style>
        .signin-panel { max-width: 440px; margin: 32px auto; }
        .signin-intro { text-align: center; }
        .signin-intro .lead { margin: 8px 0 24px; }
        .signin-service { margin: 0 0 8px; color: var(--primary); font-size: 14px; font-weight: 600; }
        .signin-form { padding: 28px; }
        .signin-form > * + * { margin-top: 20px; }
        .password-field { position: relative; }
        .password-field input { padding-right: 76px; }
        .password-toggle { position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
            border-color: transparent; color: var(--primary); }
        .signin-submit { width: 100%; }
        .signin-guest { margin: 0; text-align: center; }
        .signin-guest a { display: inline-block; padding: 8px; }
        @media (max-width: 640px) {
            .signin-panel { margin: 16px auto; }
            .signin-form { padding: 20px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-account">
            <nav class="account-nav" aria-label="계정 메뉴">
                <a href="/signin.html">로그인</a>
                <a href="/signup.html">회원가입</a>
            </nav>
        </div>
        <nav class="primary-nav" aria-label="공통 메뉴">
            <a class="site-name" href="/index.html" aria-label="첫걸음 홈"><img class="site-mark" src="/images/logo-b2-mark.svg" alt="" width="56" height="56"><span class="site-wordmark">첫걸음</span></a>
            <a href="/upload.html?v=first-step-nav">계약서 점검</a>
            <a href="/support.html?v=first-step-nav">지원사업 추천</a>
            <a href="/calendar.html?v=first-step-nav">캘린더</a>
        </nav>
    </header>
    <main>
        <section class="signin-panel" aria-labelledby="signin-title">
            <div class="signin-intro">
                <p class="signin-service">알바 첫걸음</p>
                <h1 id="signin-title">로그인</h1>
                <p class="lead">나에게 맞는 지원사업과 일정을 확인해 보세요.</p>
            </div>
            <form id="signin-form" class="card stack signin-form" method="post" action="/api/auth/signin" aria-labelledby="signin-title">
                <div>
                    <label for="email">이메일</label>
                    <input id="email" name="email" type="email" placeholder="beomjjang@dankook.ac.kr"
                        autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
                </div>
                <div>
                    <label for="password">비밀번호</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요"
                            autocomplete="current-password" required>
                        <button type="button" class="btn small password-toggle" id="toggle-password"
                            aria-controls="password" aria-label="비밀번호 표시" aria-pressed="false" hidden>보기</button>
                    </div>
                </div>
                <div id="message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
                <button type="submit" class="btn primary signin-submit" id="signin-submit" disabled>로그인</button>
                <div id="signup-welcome" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
                <noscript><p class="notice warn">로그인 화면을 이용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
            </form>
            <p class="signin-guest small">계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
            <p class="signin-guest small"><a href="/index.html">로그인 없이 둘러보기</a></p>
        </section>
    </main>
    <footer>
        <p>본 서비스는 정보 제공용이며 법률 자문이 아닙니다</p>
        <p>© RE: 지원 from DANKOOK UNIVERSITY Department of Software. All rights reserved.</p>
    </footer>
    <script>
        "use strict";

        (() => {
            const form = document.getElementById("signin-form");
            const password = document.getElementById("password");
            const toggle = document.getElementById("toggle-password");
            const message = document.getElementById("message");
            const params = new URLSearchParams(location.search);
            if (params.get("signup") === "success" || params.get("registered") === "1") {
                const welcome = document.getElementById("signup-welcome");
                welcome.textContent = "회원가입이 완료되었습니다. 알바 첫걸음에 오신 것을 환영합니다.";
                welcome.hidden = false;
                params.delete("signup");
                params.delete("registered");
                const query = params.toString();
                history.replaceState(null, "", location.pathname + (query ? "?" + query : "") + location.hash);
            }
            const next = params.get("next");
            const destination = ["/upload.html", "/confirm.html", "/report.html", "/support.html", "/calendar.html"].includes(next) ? next : "/index.html";

            toggle.addEventListener("click", () => {
                const visible = password.type === "password";
                password.type = visible ? "text" : "password";
                toggle.textContent = visible ? "숨기기" : "보기";
                toggle.setAttribute("aria-pressed", String(visible));
                toggle.setAttribute("aria-label", visible ? "비밀번호 숨기기" : "비밀번호 표시");
            });

            const email = document.getElementById("email");
            const submit = document.getElementById("signin-submit");
            let submitting = false;

            form.addEventListener("submit", async event => {
                event.preventDefault();
                if (submitting) return;
                if (!form.reportValidity()) return;
                submitting = true;
                submit.disabled = true;
                submit.textContent = "로그인 중…";
                message.hidden = true;
                let success = false;
                try {
                    const response = await fetch("/api/auth/signin", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email.value.trim(), password: password.value })
                    });
                    const result = await response.json().catch(() => null);
                    if (!response.ok) {
                        const details = result?.errors ? Object.values(result.errors).join(" ") : "";
                        throw new Error(response.status >= 500
                            ? "로그인을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요."
                            : details || result?.message || "로그인에 실패했습니다.");
                    }
                    success = true;
                    message.className = "notice";
                    message.textContent = "로그인되었습니다. 이동합니다.";
                    message.hidden = false;
                    location.assign(destination);
                } catch (error) {
                    message.className = "notice warn";
                    message.textContent = error instanceof TypeError
                        ? "서버에 연결할 수 없습니다. 네트워크를 확인한 후 다시 시도해 주세요."
                        : error.message;
                    message.hidden = false;
                } finally {
                    submitting = false;
                    if (!success) {
                        submit.disabled = false;
                        submit.textContent = "로그인";
                    }
                }
            });

            form.addEventListener("input", () => {
                message.className = "notice";
                message.hidden = true;
                message.textContent = "";
            });

            toggle.hidden = false;
            document.getElementById("signin-submit").disabled = false;
        })();
    </script>
</body>
</html>
