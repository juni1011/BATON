# Tests use a separate in-memory database unless a disposable MySQL is explicitly supplied.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:easyton;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# 기존 컨트롤러 테스트는 로그인 없이 호출한다. 로그인 필수 동작은 LoginRequiredTests가 따로 켜서 검증한다.
app.auth.required=false
